<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Simple">
    <!--
        The shop's mark.

        An S built from two true semicircles of one weight, which is the whole
        idea: the store is called Simple and sells plain stainless steel, so
        the monogram is the least a letter can be and still be that letter. The
        round caps are the one nod to what is in the cases — wire, chain, a
        clasp — and they are what keeps it from reading as a typed character.

        Drawn on a 64 grid with the stroke at 8, so it survives being a 16px
        favicon: anything finer turns to grey mush at that size. The ink field
        and the amber are the storefront's own colour tokens (ink and brand-500),
        not a second palette invented for the logo.

        SVG is the source. public/images/*.png and public/favicon.ico are
        rasterised from this file and should be regenerated from it, never
        edited — see the note in README.
    -->
    <rect width="64" height="64" rx="15" fill="#1c1917"/>
    <path d="M42 22A10 10 0 1 0 32 32A10 10 0 1 1 22 42"
          fill="none" stroke="#c9872f" stroke-width="8" stroke-linecap="round"/>
</svg>
