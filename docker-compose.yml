services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PORT: ${APP_PORT:-9000}
    image: online-store-app
    container_name: online_store_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - global_network
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT:-9000}
    ports:
      - "${APP_PORT:-9000}:${APP_PORT:-9000}"

  # Redis-backed queue worker (orders, mail, notifications)
  queue:
    image: online-store-app
    container_name: online_store_queue
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - global_network
    restart: unless-stopped
    depends_on:
      - app
    command: php artisan queue:work --tries=3 --timeout=90

  # Vite dev server for Blade/Tailwind hot reload
  vite:
    image: online-store-app
    container_name: online_store_vite
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - global_network
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${VITE_PORT:-5175}:${VITE_PORT:-5175}"
    environment:
      VITE_PORT: ${VITE_PORT:-5175}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5175}"

networks:
  global_network:
    external: true
